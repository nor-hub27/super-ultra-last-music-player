<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<style>
@property --tint{syntax:"<color>";inherits:true;initial-value:#1b1b24}
:root{--bg:#f3f4f8;--tx:#14141c;--mu:#666878;--cd:rgba(20,20,40,.05);--ln:rgba(20,20,40,.1);--ac:#0a7cc4;--tr:rgba(20,20,40,.16);--hv:rgba(20,20,40,.08);--pb:#14141c;--pf:#fff;--sh:rgba(30,30,60,.3);
box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0f;--tx:#f4f4f7;--mu:#9a9aa8;--cd:rgba(255,255,255,.05);--ln:rgba(255,255,255,.07);--ac:#7dd3fc;--tr:rgba(255,255,255,.16);--hv:rgba(255,255,255,.1);--pb:#f4f4f7;--pf:#111;--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0a0a0f;--tx:#f4f4f7;--mu:#9a9aa8;--cd:rgba(255,255,255,.05);--ln:rgba(255,255,255,.07);--ac:#7dd3fc;--tr:rgba(255,255,255,.16);--hv:rgba(255,255,255,.1);--pb:#f4f4f7;--pf:#111;--sh:rgba(0,0,0,.6)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(165deg,var(--tint),var(--bg) 62%) var(--bg);transition:--tint .7s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.f{fill:currentColor;stroke-width:1.5}
#app{height:100%;display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.player{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.cw{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
#cover{width:min(92cqw,92cqh,760px);aspect-ratio:1;object-fit:cover;border-radius:5%;box-shadow:0 18px 50px var(--sh)}
.pop{animation:pop .38s cubic-bezier(.22,1,.36,1)}@keyframes pop{from{transform:scale(.95)}}
.fade{animation:fade .45s ease-out}@keyframes fade{from{opacity:0}}
.col{width:100%;max-width:640px;margin-inline:auto}
h1{margin:10px 0 0;min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(19px,3.2vmin,30px);font-weight:600;line-height:1.25}
#sub{margin:2px 0 10px;text-align:center;color:var(--mu)}
.sk,.vl{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px}
.sk span{width:40px}.sk span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;margin:10px 0;border-radius:3px;outline:0;background:linear-gradient(90deg,var(--ac) var(--p,0%),var(--tr) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--tx)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--tx)}
.ct{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.6vmin,14px);margin:4px 0}
.ib{width:clamp(44px,5.6vmin,62px);height:clamp(44px,5.6vmin,62px);border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .12s;position:relative}
.ib:hover{background:var(--hv)}.ib:active{transform:scale(.88)}
.ib svg{width:50%;height:50%}
.ib.act{color:var(--ac)}.ib.act::after{content:"";position:absolute;bottom:6%;width:5px;height:5px;border-radius:50%;background:currentColor}
.ib.pb{width:clamp(60px,8.4vmin,86px);height:clamp(60px,8.4vmin,86px);background:var(--pb);color:var(--pf)}.ib.pb:hover{background:var(--ac)}
.vl{max-width:360px;margin:2px auto 0}.vl svg{width:20px;height:20px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--cd);border:1px solid var(--ln);border-radius:24px;padding:16px}
.tabs{display:flex;gap:18px;align-items:baseline;margin-bottom:10px;font-size:clamp(17px,2.4vmin,24px);font-weight:600}
.tabs button{color:var(--mu)}.tabs button.on{color:var(--tx)}.tabs small{color:var(--mu);font-size:14px;font-weight:400}
#qp,#lp{flex:1;min-height:0;display:flex;flex-direction:column}
body[data-view="lyrics"] #qp,body:not([data-view="lyrics"]) #lp{display:none}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer}
.row:hover{background:var(--hv)}.row.on{color:var(--ac)}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--tr);display:grid;place-items:center;color:var(--mu)}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row.on .rt b{font-weight:700}
.rt small{color:var(--mu)}
.rm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}.rm:hover{background:var(--hv)}.rm svg{width:18px;height:18px}
#em{flex:1;display:grid;place-items:center;text-align:center;color:var(--mu);padding:20px}
.ac{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;background:var(--hv);font-size:14px;cursor:pointer}
.pill.pri{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:600}
#lyst{color:var(--mu);text-align:center;margin:0 0 8px}
#ly{flex:1;min-height:0;overflow:auto;position:relative;padding:30vh 6px;text-align:center}
.ln{margin:0;padding:8px 12px;font-size:clamp(17px,2.6vmin,24px);color:var(--mu);transition:color .25s;cursor:pointer}
.ln.pl{color:var(--tx);cursor:default}.ln.on{color:var(--tx);font-weight:700}
.nav{display:flex;gap:6px;padding:6px;background:var(--cd);border:1px solid var(--ln);border-radius:20px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;color:var(--mu);font-size:12px}
.nav button.on{color:var(--ac);background:var(--hv)}.nav svg{width:22px;height:22px}
.mini{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cd);border:1px solid var(--ln);border-radius:18px}
.mini img{width:40px;height:40px;border-radius:8px;object-fit:cover}.mini b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ib{width:44px;height:44px}
body[data-view="player"] .panel,body[data-view="player"] .mini,body:not([data-view="player"]) .player{display:none}
@media (min-width:900px) and (min-aspect-ratio:11/10){
#app{flex-direction:row;gap:36px;padding:32px 40px}
.player{flex:5;display:flex!important}.panel{flex:4;display:flex!important}.nav,.mini{display:none!important}}
.tt{display:flex;align-items:center;gap:6px}.tt h1{flex:1}
.ib.sm{width:44px;height:44px;margin-top:10px}.ib.lk.act svg{fill:currentColor}.ib.lk.act::after{display:none}
.fl{display:flex;gap:6px;margin-bottom:8px;align-items:center}
#q,#lq{flex:1;min-width:0;padding:9px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--hv);color:var(--tx);font:inherit;outline:0}
.chip{padding:7px 13px;border-radius:999px;background:var(--hv);font-size:13px}.chip.on{background:var(--tx);color:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px}
#ts{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}#ts.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body data-view="player">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-sh" viewBox="0 0 24 24"><path d="M3 7h3l10 10h4M3 17h3l3.2-3.2M12.8 10.2L16 7h4M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></symbol>
<symbol id="i-rp" viewBox="0 0 24 24"><path d="M3 11v-1q0-3 3-3h14M21 13v1q0 3-3 3H4M17.5 4.5L20.5 7l-3 2.5M6.5 14.5L3.5 17l3 2.5"/></symbol>
<symbol id="i-r1" viewBox="0 0 24 24"><path d="M3 11v-1q0-3 3-3h14M21 13v1q0 3-3 3H4M17.5 4.5L20.5 7l-3 2.5M6.5 14.5L3.5 17l3 2.5M10.9 10.9l1.8-1.3v4.8"/></symbol>
<symbol id="i-pv" viewBox="0 0 24 24"><rect x="5" y="6" width="2.2" height="12" rx=".8"/><path d="M18.7 6v12L9 12z"/></symbol>

<symbol id="i-pl" viewBox="0 0 24 24"><path d="M8.3 5.3v13.4L19.5 12z"/></symbol>

<symbol id="i-v1" viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z" fill="currentColor"/><path d="M15.5 9.5a3.5 3.5 0 010 5"/></symbol>
<symbol id="i-v2" viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z" fill="currentColor"/><path d="M15.5 9.5a3.5 3.5 0 010 5M18 7a7 7 0 010 10"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
<symbol id="i-ly" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-nt" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-hr" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-pn" viewBox="0 0 24 24"><path d="M4 6h12M4 12h8M4 18h8M17 12v7M13.5 15.5h7"/></symbol>
</defs></svg>
<div id="app">
<section class="player">
<div class="cw"><img id="cover" alt="Cover art"></div>
<div class="col"><div class="tt"><h1 id="title">No song loaded</h1><button class="ib sm lk" id="lk" aria-label="Like this song"><svg><use href="#i-hr"/></svg></button></div><p id="sub"></p>
<div class="sk"><span id="el">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="tot">0:00</span></div>
<div class="ct">
<button class="ib" id="sh" aria-label="Shuffle"><svg><use href="#i-sh"/></svg></button>
<button class="ib" id="pv" aria-label="Previous"><svg class="f"><use href="#i-pv"/></svg></button>
<button class="ib pb" id="pl" aria-label="Play or pause"><svg class="f"><use href="#i-pl"/></svg></button>
<button class="ib" id="nx" aria-label="Next"><svg class="f"><use href="#i-nx"/></svg></button>
<button class="ib" id="rp" aria-label="Repeat"><svg><use href="#i-rp"/></svg></button></div>
<div class="vl"><svg><use href="#i-v1"/></svg><input id="vol" type="range" min="0" max="100" value="60" aria-label="Volume"><svg><use href="#i-v2"/></svg></div><div class="ac" style="justify-content:center"><button class="pill" id="sl">Sleep timer: off</button></div></div>
</section>
<section class="panel">
<div class="tabs"><button data-v="queue" class="on">Library</button><button data-v="lyrics">Lyrics</button><small id="cnt"></small></div>
<div id="qp"><div class="fl"><input id="q" placeholder="Search your library" aria-label="Search your library"><button class="chip on" data-f="all">All</button><button class="chip" data-f="liked">Liked</button></div><ul id="list"></ul><div id="em">Add songs or a whole folder<br>from your device, or drop them here<br><small>On a phone, open the folder in the picker and tap Select all.</small></div>
<div class="ac"><label class="pill pri">＋ Add songs<input id="fi" type="file" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.lrc,.txt" multiple hidden></label><label class="pill pri" id="fdl">＋ Add folder<input id="fo" type="file" webkitdirectory multiple hidden></label><button class="pill" id="clr">Clear</button></div></div>
<div id="lp"><p id="lyst"></p><div id="ly"></div>
<div class="ac"><input id="lq" placeholder="Artist and song (optional)" aria-label="Lyrics search"><button class="pill pri" id="lf">Search online</button></div>
<div class="ac"><label class="pill">＋ .lrc file<input id="fl" type="file" accept=".lrc,.txt" multiple hidden></label><label class="chk"><input type="checkbox" id="au"> Search automatically</label></div></div>
</section>
<div class="mini"><img id="mi" alt=""><b id="mt"></b><button class="ib" id="mp" aria-label="Play or pause"><svg class="f"><use href="#i-pl"/></svg></button><button class="ib" id="mn" aria-label="Next"><svg class="f"><use href="#i-nx"/></svg></button></div>
<nav class="nav"><button data-v="player"><svg><use href="#i-nt"/></svg>Now playing</button><button data-v="queue"><svg><use href="#i-q"/></svg>Library</button><button data-v="lyrics"><svg><use href="#i-ly"/></svg>Lyrics</button></nav>
<div id="ts" role="status"></div>
</div>
